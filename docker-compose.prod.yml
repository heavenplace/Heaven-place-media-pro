# Production stack — for a host that stays up (a VPS or any machine running Docker).
#
#   cp deploy/.env.prod.example .env.prod    # fill it in; .env.prod is git-ignored
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This is NOT the sandbox stack. docker-compose.base44.yml runs the same source from a
# bind mount with live reload and is what the Base44 preview uses; nothing here touches it.
#
# The app needs a long-running Node process, Postgres and a disk for the media it serves,
# so shared/cPanel hosting cannot run it — use a host where you can run Docker.
name: streamcast-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:-streamcast}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamcast} -d ${POSTGRES_DB:-streamcast}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-streamcast}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}@db:5432/${POSTGRES_DB:-streamcast}
      UPLOAD_DIR: /app/uploads
      # Signs every session (30 days). Must be set, and must not change later: without it
      # the API falls back to a hardcoded development value, and a new value signs
      # everyone out.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your env file}
      # The control-room account, created on first boot (api/db.js ensureAdmin).
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in your env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your env file}
      # The site is the only public origin, so CORS only has to allow that one — and a
      # Stripe checkout returns to it.
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in your env file}
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PRCPAY_API_KEY: ${PRCPAY_API_KEY:-}
      PRCPAY_BASE_URL: ${PRCPAY_BASE_URL:-}
      PRCPAY_ACCOUNT: ${PRCPAY_ACCOUNT:-streamcastpro}
      PRCPAY_CHARGE_PATH: ${PRCPAY_CHARGE_PATH:-}
      PRCPAY_TRANSFER_PATH: ${PRCPAY_TRANSFER_PATH:-}
      PRCPAY_WEBHOOK_IPS: ${PRCPAY_WEBHOOK_IPS:-}
      PREMIUM_PRICE_CENTS: ${PREMIUM_PRICE_CENTS:-600}
      STATION_FEE_STANDARD_CENTS: ${STATION_FEE_STANDARD_CENTS:-500}
      STATION_FEE_PREMIUM_CENTS: ${STATION_FEE_PREMIUM_CENTS:-1500}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your subdomain}
      API_UPSTREAM: api:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  uploads:
